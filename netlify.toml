[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Scheduled function for grant sync (every 6 hours)
# Note: Requires Netlify Pro for scheduled functions
# Alternative: Use EasyCron to call /api/cron/sync-grants

# Environment variables to set in Netlify dashboard:
# - NEXT_PUBLIC_SUPABASE_URL
# - NEXT_PUBLIC_SUPABASE_ANON_KEY
# - SUPABASE_SERVICE_ROLE_KEY
# - SIMPLER_GRANTS_API_KEY
# - RESEND_API_KEY
# - CRON_SECRET
